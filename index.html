<body>

<div class="top-banner" id="mount-banner"></div>

<header>
  <div class="wrap header-row">
    <a class="logo" id="mount-logo" href="#top" aria-label="Home"></a>
    <nav class="primary-nav" aria-label="Main">
      <a href="#catalog" id="nav-shop"></a>
      <a href="#about" id="nav-about"></a>
      <a href="#location" id="nav-contact"></a>
    </nav>
    <div class="header-actions">
      <button class="icon-btn" id="theme-toggle" type="button" aria-label="Switch between light and dark mode" title="Light / dark">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg>
      </button>
      <button class="icon-btn hamburger" id="hamburger-btn" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="drawer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>
  </div>
</header>

<div class="drawer-overlay" id="drawer-overlay"></div>
<nav class="drawer" id="drawer" aria-label="Mobile navigation" aria-hidden="true">
  <button class="drawer-close" id="drawer-close" type="button" aria-label="Close menu">✕</button>
  <a href="#catalog" id="drawer-shop"></a>
  <a href="#about" id="drawer-about"></a>
  <a href="#location" id="drawer-contact"></a>
</nav>

<main id="top">
<section class="hero">
  <div class="wrap hero-grid">
    <div class="hero-copy">
      <h1 id="mount-hero-headline"></h1>
      <p class="lead" id="mount-hero-subtitle"></p>
      <div class="hero-ctas">
        <a href="#catalog" class="btn btn-primary" id="mount-hero-cta-primary"></a>
        <a href="#location" class="btn btn-outline" id="mount-hero-cta-secondary"></a>
      </div>
    </div>
    <div class="hero-photos" id="mount-hero-swatches"></div>
  </div>
</section>

<section class="trust-strip">
  <div class="wrap trust-row" id="mount-trust-row"></div>
</section>

<section class="about" id="about" hidden>
  <div class="wrap about-grid">
    <div class="about-photo swatch swatch--2" id="mount-about-photo" hidden></div>
    <div class="about-copy">
      <h2 id="mount-about-title"></h2>
      <div id="mount-about-text"></div>
    </div>
  </div>
</section>

<section class="catalog wrap" id="catalog">
  <div class="catalog-head">
    <div>
      <h2 id="mount-catalog-title"></h2>
      <p id="mount-catalog-subtitle"></p>
    </div>
  </div>
  <div class="filter-tabs" id="filter-tabs" role="tablist"></div>
  <div class="product-grid" id="product-grid"></div>
  <p class="catalog-status" id="catalog-status" role="status" hidden></p>
</section>

<section class="steps" id="how-to-order" hidden>
  <div class="wrap">
    <h2 id="mount-steps-title"></h2>
    <p class="steps-sub" id="mount-steps-sub"></p>
    <ol class="steps-grid" id="mount-steps"></ol>
  </div>
</section>

<section class="location" id="location">
  <div class="wrap location-grid">
    <div>
      <h2 id="mount-location-title"></h2>
      <ul class="info-list" id="mount-info-list"></ul>
      <div class="location-actions" id="mount-location-actions"></div>
      <div class="badges" id="mount-badges"></div>
    </div>
    <div class="map-block">
      <iframe id="mount-map-frame" class="map-frame" loading="lazy" referrerpolicy="no-referrer-when-downgrade" title="Store location map"></iframe>
      <div class="map-caption" id="mount-map-caption"></div>
    </div>
  </div>
</section>
</main>

<footer class="wrap">
  <div class="footer-row">
    <div class="footer-brand" id="mount-footer-brand"></div>
    <div class="social-links" id="mount-social-links"></div>
  </div>
  <div class="copyright">© <span id="year"></span> <span id="mount-copyright-name"></span>. All rights reserved.</div>
</footer>

<a class="fab" id="fab" href="#" target="_blank" rel="noopener" hidden>
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 20.5l1.7-5.4A8.4 8.4 0 1 1 21 11.5z"/></svg>
  <span id="fab-label">Chat</span>
</a>

<!-- Product detail (opens when a product photo is tapped) -->
<div class="modal" id="product-modal" role="dialog" aria-modal="true" aria-labelledby="pm-title" hidden>
  <div class="modal-backdrop" id="pm-backdrop"></div>
  <div class="modal-sheet">
    <button class="modal-close" id="pm-close" type="button" aria-label="Close">✕</button>
    <div class="pm-gallery-wrap">
      <div class="pm-gallery" id="pm-gallery"></div>
      <button class="pm-nav pm-prev" id="pm-prev" type="button" aria-label="Previous photo" hidden>‹</button>
      <button class="pm-nav pm-next" id="pm-next" type="button" aria-label="Next photo" hidden>›</button>
      <div class="pm-dots" id="pm-dots"></div>
    </div>
    <div class="pm-info">
      <span class="category-label" id="pm-category"></span>
      <h3 id="pm-title"></h3>
      <div class="price" id="pm-price"></div>
      <p class="pm-desc" id="pm-desc"></p>
      <div class="pm-group" id="pm-sizes-group" hidden>
        <div class="pm-label" id="pm-sizes-label">Size</div>
        <div class="chips" id="pm-sizes" role="radiogroup" aria-labelledby="pm-sizes-label"></div>
      </div>
      <div class="pm-group" id="pm-colors-group" hidden>
        <div class="pm-label" id="pm-colors-label">Colour</div>
        <div class="chips" id="pm-colors" role="radiogroup" aria-labelledby="pm-colors-label"></div>
      </div>
      <p class="pm-error" id="pm-error" role="alert" hidden></p>
      <button class="btn btn-whatsapp pm-order" id="pm-order" type="button">Order on WhatsApp</button>
    </div>
  </div>
</div>

</body>
</html>
